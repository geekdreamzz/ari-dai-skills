name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node.js syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.mjs')

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')

      - name: Validate skill registry metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const errors = [];
          let count = 0;
          for (const entry of fs.readdirSync('skills', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const dir = path.join('skills', entry.name);
            if (!fs.existsSync(path.join(dir, 'SKILL.md'))) continue;
            count += 1;

            const metadataPath = path.join(dir, 'skill.json');
            if (!fs.existsSync(metadataPath)) {
              errors.push(`${entry.name}: missing skill.json`);
              continue;
            }

            try {
              const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
              if (metadata.visibility !== 'public') {
                errors.push(`${entry.name}: visibility must be "public"`);
              }
              if (metadata.repo !== 'github.com/geekdreamzz/ari-dai-skills') {
                errors.push(`${entry.name}: unexpected repo metadata`);
              }
            } catch (error) {
              errors.push(`${entry.name}: invalid skill.json (${error.message})`);
            }
          }

          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log(`Validated ${count} skills`);
          NODE

      - name: Smoke-test skill installer
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          bash install.sh --all --project "$tmp_dir" --copy

          shopt -s nullglob
          source_skills=(skills/*/SKILL.md)
          installed_skills=("$tmp_dir"/.claude/skills/*/SKILL.md)
          test "${#installed_skills[@]}" -eq "${#source_skills[@]}"
